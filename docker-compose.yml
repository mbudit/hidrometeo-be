version: '3.8'

services:
  # ──────────────────────────────────────────────
  # TimescaleDB (PostgreSQL 16 with TimescaleDB)
  # ──────────────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: hidrometeo-timescaledb
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-hidrometeo}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    networks:
      - hidrometeo
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # EMQX MQTT Broker
  # ──────────────────────────────────────────────
  emqx:
    image: emqx/emqx
    container_name: hidrometeo-emqx
    restart: unless-stopped
    ports:
      - '${MQTT_PORT:-1883}:1883'       # MQTT TCP
      - '8083:8083'                       # MQTT WebSocket
      - '8084:8084'                       # MQTT WebSocket/SSL
      - '8883:8883'                       # MQTT SSL
      - '18083:18083'                     # EMQX Dashboard
    environment:
      EMQX_NAME: hidrometeo
      EMQX_HOST: 127.0.0.1
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - hidrometeo
    healthcheck:
      test: ['CMD', 'emqx', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Prometheus
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus
    container_name: hidrometeo-prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - prometheus_data:/prometheus
    networks:
      - hidrometeo

  # ──────────────────────────────────────────────
  # Grafana
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana
    container_name: hidrometeo-grafana
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hidrometeo
    depends_on:
      - prometheus

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: hidrometeo-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - hidrometeo
    depends_on:
      - timescaledb
      - emqx

volumes:
  timescaledb_data:
    driver: local
  emqx_data:
    driver: local
  emqx_log:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  hidrometeo:
    driver: bridge
